
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vital Signs</title>

    <link rel="stylesheet" href="../Patient- Dashboard/Vitalsigns.css">
</head>

<body>

    <main class="vitals-container">

        <section class="recent-vitals">

            <div class="vitals-heading">
                <h2>Recent Vital Readings</h2>

                <a href="NewRecord.html" class="add-record-btn">
                    + Add New Record
                </a>
            </div>

            <div class="table-wrapper">

                <table class="vitals-table">

                    <thead>
                        <tr>
                            <th>Vital Type</th>
                            <th>Reading</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Notes</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Blood Pressure</td>
                            <td>120/80 mmHg</td>
                            <td>03-11-2026</td>
                            <td>09:00 AM</td>
                            <td>Normal reading</td>
                        </tr>

                        <tr>
                            <td>Heart Rate</td>
                            <td>72 bpm</td>
                            <td>03-11-2026</td>
                            <td>09:05 AM</td>
                            <td>Regular heartbeat</td>
                        </tr>

                        <tr>
                            <td>Oxygen Saturation</td>
                            <td>98%</td>
                            <td>03-11-2026</td>
                            <td>09:10 AM</td>
                            <td>Normal oxygen level</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

        <div class="back-container">
            <a href="Profile.html" class="back-btn">Back</a>
        </div>

    </main>

    <footer class="vitals-footer">
        <p>&copy; 2026 Patient Health Dashboard</p>
    </footer>

</body>
</html>
