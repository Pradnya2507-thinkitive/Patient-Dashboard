<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../Patient- Dashboard/NewRecord.css">
</head>
<body>
    <main class="form-container">
    <form class="vital-form">
        <h2>Add New Vital Sign Reading</h2>
        <fieldset>
            <legend>Vital Signs:</legend>
            <div class="form-group">
            <label for="vitalType">Select Vital Type:</label>
            <select id="vitaltype" name="vitaltype" required>
                <option value="">-- Select --</option>
                <option value="blood_pressure">Blood Pressure</option>
                <option value="heart_rate">Heart Rate</option>
                <option value="oxygen_saturation">Oxygen Saturation</option>
            </select>
            </div>

    
            <div class="form-group">
            <label for="reading">Reading value:</label>
            <input type="text" id="reading" name="reading" placeholder="Enter reading" required>
            </div>
            
            <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
            <label for="time">Time:</label>
            <input type="time" id="time" name="time" required>
            </div>

            <div class="form-group">
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes" rows="4" cols="50" placeholder="Enter any additional notes"></textarea>
            </div>

        </fieldset>
        
        <button type="submit" value="Submit" class="submit-btn">Submit</button>
    </form>

    </main>
</body>
</html>
